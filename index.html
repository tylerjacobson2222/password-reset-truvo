<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>
  <h2>Reset Your Password</h2>
  <input type="password" id="new-password" placeholder="New Password" /><br/><br/>
  <input type="password" id="confirm-password" placeholder="Confirm Password" /><br/><br/>
  <button id="reset-btn">Update Password</button>
  <p id="message"></p>

  <script>
    // 1️⃣ Replace with your Supabase project info
    const SUPABASE_URL = 'https://muawnjdvgsprgxhkccyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YXduamR2Z3Nwcmd4aGtjY3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NzIyMDMsImV4cCI6MjA4MTE0ODIwM30.PXfs7s5acjjUO5LIPUp9wZBKwzZYC1DQjmzDCRdRtx4';
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2️⃣ Extract the access token from the URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const accessToken = urlParams.get('access_token');

    document.getElementById('reset-btn').onclick = async () => {
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!newPassword || !confirmPassword) return alert('Enter both fields');
      if (newPassword !== confirmPassword) return alert('Passwords do not match');

      // 3️⃣ Call Supabase API to update password using token
      const { data, error } = await supabase.auth.updateUser({
        accessToken,
        password: newPassword
      });

      if (error) {
        document.getElementById('message').textContent = error.message;
      } else {
        document.getElementById('message').textContent = 'Password updated successfully!';
      }
    };
  </script>
</body>
</html>
