<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f9f9f9; }
    h1 { text-align: center; }
    .container { max-width: 400px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 0.8rem; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005ecb; }
    #message { margin-top: 1rem; text-align: center; color: red; }
  </style>
</head>
<body>

  <h1>Reset Password</h1>
  <div class="container">
    <input type="password" id="new-password" placeholder="New Password">
    <input type="password" id="confirm-password" placeholder="Confirm Password">
    <button id="reset-btn">Update Password</button>
    <div id="message"></div>
  </div>

  <!-- Supabase v2 as ES Module -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.37.0/dist/module/supabase.js';

    // 1️⃣ Initialize Supabase
    const SUPABASE_URL = 'https://muawnjdvgsprgxhkccyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YXduamR2Z3Nwcmd4aGtjY3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NzIyMDMsImV4cCI6MjA4MTE0ODIwM30.PXfs7s5acjjUO5LIPUp9wZBKwzZYC1DQjmzDCRdRtx4';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageDiv = document.getElementById('message');

    // 2️⃣ Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const accessToken = urlParams.get('token');

    // 3️⃣ Handle button click
    document.getElementById('reset-btn').addEventListener('click', async () => {
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      messageDiv.style.color = 'red';

      if (!newPassword || !confirmPassword) {
        messageDiv.textContent = 'Please fill out both fields.';
        return;
      }

      if (newPassword !== confirmPassword) {
        messageDiv.textContent = 'Passwords do not match.';
        return;
      }

      if (!accessToken) {
        messageDiv.textContent = 'Invalid or missing token.';
        return;
      }

      // 4️⃣ Set session using the token
      const { error: sessionError } = await supabase.auth.setSession({ access_token: accessToken });
      if (sessionError) {
        messageDiv.textContent = sessionError.message;
        return;
      }

      // 5️⃣ Update password
      const { error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) {
        messageDiv.textContent = error.message;
      } else {
        messageDiv.style.color = 'green';
        messageDiv.textContent = 'Password updated successfully! Redirecting to login...';
        // Optional: redirect after 3 seconds
        setTimeout(() => {
          window.location.href = '/login'; // replace with your login page
        }, 3000);
      }
    });
  </script>

</body>
</html>
